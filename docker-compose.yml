services:
  apiweb01:
    container_name: apiweb01
    build: ./api
    environment:
      - PORT=3000
      - MESSAGE=${MESSAGE_APIWEB01}
    ports:
      - "${PORT_APIWEB01}:3000"
    volumes:
      - ./logs/apiweb01:/opt/logs
    restart: always

  apiweb02:
    container_name: apiweb02
